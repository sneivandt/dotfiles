version: 2

updates:
  - package-ecosystem: npm
    directory: /docs
    ignore:
      # Stable VitePress uses Rollup hooks that break with Vite 8/Rolldown.
      # Keep the tested Vite 6 line until VitePress supports a newer bundler.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # vue-tsc embeds the TypeScript 6 compiler API; TS 7 removes it.
      # Revisit when https://github.com/vuejs/language-tools/issues/6124 is supported.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node API types aligned with docs/.node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt
    groups:
      documentation-security:
        applies-to: security-updates
        patterns:
          - "*"
      documentation:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
      rust-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: rust-toolchain
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
