version: 2

updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt
    groups:
      documentation-security:
        applies-to: security-updates
        patterns:
          - "*"
      documentation:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
      rust-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: rust-toolchain
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - sneivandt
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
