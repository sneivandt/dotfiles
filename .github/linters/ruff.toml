target-version = "py310"
line-length = 100

exclude = [
  ".git",
  "**/cli/target",
  "**/docs/.vitepress/cache",
  "**/docs/dist",
  "**/docs/node_modules",
]

[lint]
select = [
  "E4",
  "E7",
  "E9",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "C4",
  "PIE",
  "SIM",
  "RET",
  "RUF",
  "PERF",
  "TC",
]

[lint.isort]
force-sort-within-sections = true

[lint.per-file-ignores]
# Test runners insert their sibling or shared tests/ directory into sys.path before importing.
"**/.github/workflows/scripts/test_ci_changes.py" = ["E402"]
"**/tests/**/test_*.py" = ["E402"]
