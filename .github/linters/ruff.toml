target-version = "py310"

exclude = [
  ".git",
  "**/cli/target",
  "**/docs/.vitepress/cache",
  "**/docs/.vitepress/dist",
  "**/docs/node_modules",
]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test runners insert their sibling package directory into sys.path before importing.
"**/.github/workflows/scripts/linux/test-ci-changes.py" = ["E402"]
"**/tests/shell/test-shell-config.py" = ["E402"]
"**/tests/hooks/test-git-hooks.py" = ["E402"]
"**/tests/hooks/test-hook-inputs.py" = ["E402"]
"**/tests/desktop/quickshell/python/test_network_helper.py" = ["E402"]
