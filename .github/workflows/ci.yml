name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mutation_base:
        description: "Compare Rust sources with this ancestor SHA for mutation testing"
        type: string
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-changes:
    name: "CI: Classify changes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_docs_checks: ${{ steps.classify.outputs.run_docs_checks }}
      run_lint: ${{ steps.classify.outputs.run_lint }}
      lint_matrix: ${{ steps.classify.outputs.lint_matrix }}
      run_validate_config: ${{ steps.classify.outputs.run_validate_config }}
      run_config_drift: ${{ steps.classify.outputs.run_config_drift }}
      run_rust_checks: ${{ steps.classify.outputs.run_rust_checks }}
      run_rust_fmt: ${{ steps.classify.outputs.run_rust_fmt }}
      run_audit: ${{ steps.classify.outputs.run_audit }}
      run_deny: ${{ steps.classify.outputs.run_deny }}
      run_mutation: ${{ steps.classify.outputs.run_mutation }}
      comparison_base: ${{ steps.range.outputs.base_sha }}
      comparison_head: ${{ steps.range.outputs.head_sha }}
      run_build_linux: ${{ steps.classify.outputs.run_build_linux }}
      run_build_windows: ${{ steps.classify.outputs.run_build_windows }}
      run_profile_linux: ${{ steps.classify.outputs.run_profile_linux }}
      run_profile_windows: ${{ steps.classify.outputs.run_profile_windows }}
      run_roundtrip_linux: ${{ steps.classify.outputs.run_roundtrip_linux }}
      run_roundtrip_windows: ${{ steps.classify.outputs.run_roundtrip_windows }}
      run_app_tests: ${{ steps.classify.outputs.run_app_tests }}
      run_app_windows: ${{ steps.classify.outputs.run_app_windows }}
      app_matrix: ${{ steps.classify.outputs.app_matrix }}
      run_git_hooks: ${{ steps.classify.outputs.run_git_hooks }}
      run_hook_inputs: ${{ steps.classify.outputs.run_hook_inputs }}
      run_wrapper_linux: ${{ steps.classify.outputs.run_wrapper_linux }}
      run_wrapper_windows: ${{ steps.classify.outputs.run_wrapper_windows }}
      run_managed_scripts: ${{ steps.classify.outputs.run_managed_scripts }}
      run_prompt: ${{ steps.classify.outputs.run_prompt }}
      run_lock: ${{ steps.classify.outputs.run_lock }}
      run_desktop_qml: ${{ steps.classify.outputs.run_desktop_qml }}
      run_desktop_python: ${{ steps.classify.outputs.run_desktop_python }}
      run_stocks: ${{ steps.classify.outputs.run_stocks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine comparison range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MUTATION_BASE: ${{ inputs.mutation_base }}
        run: sh .github/workflows/scripts/linux/ci-comparison-range.sh
      - name: Classify changed paths
        id: classify
        env:
          DIR: ${{ github.workspace }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
          CI_FORCE_FULL: ${{ steps.range.outputs.force_full }}
        run: sh .github/workflows/scripts/linux/classify-ci-changes.sh
      - name: Install actionlint
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          checksums="actionlint_${version}_checksums.txt"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          install_dir="$(mktemp -d)"
          curl --fail --location --retry 3 "$base_url/$archive" -o "$install_dir/$archive"
          curl --fail --location --retry 3 "$base_url/$checksums" -o "$install_dir/$checksums"
          (cd "$install_dir" && sha256sum --check --ignore-missing "$checksums")
          tar -xzf "$install_dir/$archive" -C "$install_dir" actionlint
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Check workflow syntax and expressions
        run: sh .github/workflows/scripts/linux/test-workflows.sh
      - name: Check CI job gate
        run: python3 .github/workflows/scripts/linux/check-ci-contract.py
      - name: Test change classification and release selection
        run: python3 -B .github/workflows/scripts/linux/test-ci-changes.py

  # ── Rust Format Check ──────────────────────────────────
  rust-fmt:
    name: "Rust: Format Check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_rust_fmt == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --check

  # ── Script Linting ────────────────────────────────────
  lint:
    name: "Lint: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_lint == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ${{ matrix.name }}
        run: ${{ matrix.setup }}
      - name: Run ${{ matrix.name }}
        env:
          DIR: ${{ github.workspace }}
        run: sh .github/workflows/scripts/linux/test-static-analysis.sh ${{ matrix.test_function }}

  managed-script-regressions:
    name: "Regression: Managed scripts (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_managed_scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check PowerShell profile behavior
        if: needs.classify-changes.outputs.run_prompt == 'true'
        shell: pwsh
        run: ./symlinks/config/powershell/tests/Test-Prompt.ps1
      - name: Install desktop-script regression tools
        if: runner.os == 'Linux' && needs.classify-changes.outputs.run_lock == 'true'
        run: sh .github/workflows/scripts/linux/install-apt-packages.sh lua5.4 jq
      - name: Check desktop script behavior
        if: needs.classify-changes.outputs.run_lock == 'true'
        run: python -B -m unittest discover -s symlinks/config/hypr/scripts/tests -p 'test_*.py'
      - name: Check desktop network and power actions
        if: needs.classify-changes.outputs.run_desktop_python == 'true'
        run: python -B -m unittest discover -s symlinks/config/quickshell/tests/python -p 'test_*.py'

  desktop-qml:
    name: "Regression: Quickshell QML"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_desktop_qml == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt Quick Test
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: linux_gcc_64
      - name: Test QML with inert Quickshell mocks
        run: sh .github/workflows/scripts/linux/test-desktop-qml.sh
      - name: Start Quickshell in a disposable Wayland session
        run: >-
          docker run --rm --init --volume "$GITHUB_WORKSPACE:/workspace:ro"
          archlinux@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
          sh /workspace/.github/workflows/scripts/linux/test-desktop-session.sh

  # ── Documentation Consistency ─────────────────────────
  docs:
    name: "Docs: Content and site"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_docs_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm --prefix docs ci --no-audit --no-fund
      - name: Install browser test runtime
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Install Rust toolchain
        run: cd cli && rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
      - name: Check documentation consistency
        env:
          DIR: ${{ github.workspace }}
        run: sh .github/workflows/scripts/linux/test-docs.sh docs_links docs_task_selectors docs_site
      - name: Save the verified documentation site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/dist/
          if-no-files-found: error
          retention-days: 7

  # ── Configuration Validation ──────────────────────────
  validate-config:
    name: "Config: Validate all"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_validate_config == 'true' && needs.build-linux.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Run typed configuration validation
        run: ./bin/dotfiles check --root . -p desktop --only config-diagnostics,symlink-sources,config-files

  test-stocks:
    name: "Regression: Stock ticker"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_stocks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test stock ticker
        env:
          DIR: ${{ github.workspace }}
        run: sh .github/workflows/scripts/linux/test-stocks.sh

  test-hook-inputs:
    name: "Regression: Isolated hook inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_hook_inputs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test staged inputs and repository isolation
        run: sh .github/workflows/scripts/linux/test-hook-inputs.sh

  # ── Security ──────────────────────────────────────────
  audit:
    name: "Security: Cargo Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_audit == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
      - name: Install cargo-audit
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: "Security: Cargo Deny"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_deny == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo deny check all

  # ── Build, Clippy & Test ──────────────────────────────
  build-linux:
    name: "Build: Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_build_linux == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Build CI binary
        if: needs.classify-changes.outputs.run_rust_checks != 'true' && needs.classify-changes.outputs.run_config_drift != 'true'
        run: cargo build --locked --profile ci
      - name: Clippy
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo clippy --locked --profile ci --all-targets -- -D warnings
      - name: Tests
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo test --locked --profile ci
      - name: Rustdoc
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo doc --locked --profile ci --no-deps --document-private-items
      - name: Configuration drift tests
        if: needs.classify-changes.outputs.run_config_drift == 'true' && needs.classify-changes.outputs.run_rust_checks != 'true'
        run: cargo test --locked --profile ci --test config_drift
      - name: Test build-version Git dependencies
        if: needs.classify-changes.outputs.run_rust_checks == 'true' || needs.classify-changes.outputs.run_hook_inputs == 'true'
        run: sh ../.github/workflows/scripts/linux/test-hook-inputs.sh test_build_version_ref_triggers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-linux
          path: cli/target/ci/dotfiles
          retention-days: 1

  # ── MSRV (Minimum Supported Rust Version) ─────────────
  msrv:
    name: "Rust: MSRV"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_rust_checks == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve MSRV
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$msrv" ]]; then
            echo "Cargo.toml does not declare rust-version." >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Check against MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked --profile ci --all-targets

  # ── Coverage (informational, non-gating) ──────────────
  coverage:
    name: "Rust: Coverage (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: true
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_rust_checks == 'true'
    defaults:
      run:
        working-directory: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --locked --profile ci --all-targets --summary-only
      - name: Generate HTML coverage report
        run: cargo llvm-cov report --profile ci --html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-coverage-${{ matrix.name }}
          path: cli/target/llvm-cov/html
          if-no-files-found: ignore
          retention-days: 7

  # ── Mutation Testing (gating) ───────
  mutation:
    name: "Rust: Mutation (changed code, shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_mutation == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build changed-code diff
        shell: bash
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.comparison_base }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.comparison_head }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Selected mutation testing requires a comparison base." >&2
            exit 1
          fi
          git diff --relative=cli --no-renames --unified=0 "$BASE_SHA" "$HEAD_SHA" -- src > mutants.diff
          if [[ ! -s mutants.diff ]]; then
            echo "Selected mutation testing produced an empty source diff." >&2
            exit 1
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Install cargo-mutants
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants@27.1.0
      - name: Test changed-code mutants
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        # cargo-mutants does not evaluate cfg attributes. These Windows-only
        # functions/modules are absent on Linux, not gaps in its test coverage.
        # Keep exclusions here (not in crate config) so Windows can test them.
        # PATH backend names also cover their tested unsupported-host stubs.
        # Canonicalizing an existing regular settings file is equivalent to
        # writing its original path; retain every other settings mutation.
        # The Unix lock flags are disjoint, so XOR has the same effect as OR.
        run: >-
          cargo mutants --in-place --no-shuffle --in-diff mutants.diff
          --shard "$MUTATION_SHARD/8"
          --exclude 'src/infra/run_lock/windows.rs'
          --exclude-re '^src/infra/run_lock\.rs:[0-9]+:[0-9]+: replace \| with \^ in RunLock::acquire_path$'
          --exclude-re '^src/domains/files/resources/symlink/platform\.rs:.*\b(rename_noreplace_windows|rename_noreplace_unsupported)\b'
          --exclude-re '^src/infra/elevation\.rs:.*\b(run_elevated_child|wait_if_elevated)\b'
          --exclude-re '^src/domains/dotfiles/resources/path_entry\.rs:.*\b(decode_reg_string|append_user_path|user_path_contains)\b'
          --exclude-re '^src/domains/ai/apm/cowork\.rs:.*\bis_desired_skill_directory\b'
          --exclude-re '^src/domains/system/resources/registry\.rs:.*\bnative::'
          --exclude-re '^src/domains/ai/resources/agent_settings\.rs:[0-9]+:[0-9]+: replace match guard metadata\.is_symlink\(\) with true in <impl Resource for AgentSettingResource>::apply$'
          --cargo-arg=--profile=ci --cargo-arg=--locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-mutation-results-${{ matrix.shard }}
          path: cli/mutants.out
          if-no-files-found: ignore
          retention-days: 7

  mutation-windows:
    name: "Rust: Native Windows mutation (shard ${{ matrix.shard }})"
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_mutation == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants@27.1.0
      - name: Check native registry, PATH and elevation contracts
        shell: bash
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        # These functions are compiled out of Linux. Exercise their full range
        # even when this push changes only their consumers or tests.
        run: >-
          cargo mutants --in-place --no-shuffle
          --shard "$MUTATION_SHARD/2"
          --file src/domains/dotfiles/resources/path_entry.rs
          --file src/domains/system/resources/registry.rs
          --file src/infra/elevation.rs
          --re '(decode_reg_string|encode_reg_string|native::raw_value_to_string|native::raw_value_type|run_elevated_child)'
          --cargo-arg=--profile=ci --cargo-arg=--locked --cargo-arg=--lib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-mutation-results-windows-${{ matrix.shard }}
          path: cli/mutants.out
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: "Build: Windows"
    runs-on: windows-latest
    timeout-minutes: 120
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_build_windows == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable Windows Defender real-time monitoring
        continue-on-error: true
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          } catch {
            Write-Host "Could not disable Defender real-time monitoring (likely tamper protection); continuing: $_"
          }
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      # Full tests build target/ci/dotfiles.exe for Rust changes. Non-Rust
      # changes still need an artifact for the downstream Windows jobs.
      - name: Build CI binary
        if: needs.classify-changes.outputs.run_rust_checks != 'true'
        run: cargo build --locked --profile ci
      - name: Clippy
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo clippy --locked --profile ci --all-targets -- -D warnings
      - name: Tests
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo test --locked --profile ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-windows
          path: cli/target/ci/dotfiles.exe
          retention-days: 1

  # ── Integration Tests ─────────────────────────────────
  integration-linux:
    name: "Integration: ${{ matrix.profile }} on Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_profile_linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile: [base, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Create an empty fixture home
        shell: bash
        run: sh .github/workflows/scripts/linux/ci-fixture-home.sh
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Dry-run update
        # APM is not provisioned in this profile matrix.
        run: ./bin/dotfiles update --root . -p ${{ matrix.profile }} -n --skip agent-packages,vscode-extensions
      - name: Run validation
        # Linters have dedicated jobs; APM is not provisioned in this matrix.
        run: ./bin/dotfiles check --root . -p ${{ matrix.profile }} --skip shellcheck,psscriptanalyzer,apm-plugins

  integration-windows:
    name: "Integration: ${{ matrix.profile }} on Windows"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_profile_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile: [base, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: bash
        run: sh .github/workflows/scripts/linux/ci-fixture-home.sh
      - name: Dry-run update
        # APM is not provisioned in this profile matrix.
        shell: bash
        run: ./bin/dotfiles.exe update --root . -p ${{ matrix.profile }} -n --skip agent-packages,vscode-extensions
      - name: Run validation
        shell: bash
        # Linters have dedicated jobs; APM is not provisioned in this matrix.
        run: ./bin/dotfiles.exe check --root . -p ${{ matrix.profile }} --skip shellcheck,psscriptanalyzer,apm-plugins

  test-install-uninstall:
    name: "Integration: Install/Uninstall round-trip"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_roundtrip_linux == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Create an empty fixture home
        shell: bash
        run: sh .github/workflows/scripts/linux/ci-fixture-home.sh
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Run install/uninstall round-trip test
        env:
          DIR: ${{ github.workspace }}
          BINARY_PATH: ${{ github.workspace }}/bin/dotfiles
        run: sh .github/workflows/scripts/linux/test-uninstall.sh
      - name: Check native Arch convergence and recovery
        run: >-
          docker run --rm --init --volume "$GITHUB_WORKSPACE:/workspace:ro"
          archlinux@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
          sh /workspace/.github/workflows/scripts/linux/test-arch-acceptance.sh

  test-install-uninstall-windows:
    name: "Integration: Install/Uninstall round-trip (Windows)"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_roundtrip_windows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: bash
        run: sh .github/workflows/scripts/linux/ci-fixture-home.sh
      - name: Run install/uninstall round-trip test
        shell: pwsh
        env:
          DIR: ${{ github.workspace }}
          BINARY_PATH: ${{ github.workspace }}/bin/dotfiles.exe
        run: ./.github/workflows/scripts/windows/Test-InstallUninstall.ps1

  # ── Application Tests ─────────────────────────────────
  test-applications:
    name: "App: ${{ matrix.application }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_app_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.app_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create an empty fixture home
        shell: bash
        run: sh .github/workflows/scripts/linux/ci-fixture-home.sh
      - name: Install ${{ matrix.packages }}
        run: sh .github/workflows/scripts/linux/install-apt-packages.sh ${{ matrix.packages }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Install dotfiles with base profile
        run: ./bin/dotfiles update --root . -p base -v --skip agent-packages
      - name: Test ${{ matrix.application }}
        env:
          DIR: ${{ github.workspace }}
        run: sh .github/workflows/scripts/linux/test-applications.sh ${{ matrix.application }} ${{ matrix.tests }}

  # Windows counterpart. Only git is covered: zsh, vim, and nvim are excluded
  # from the Windows profile, so they have no Windows equivalent to test.
  test-applications-windows:
    name: "App: ${{ matrix.application }} (Windows)"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_app_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: Git
            tests: Config Alias Behavior
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: bash
        run: sh .github/workflows/scripts/linux/ci-fixture-home.sh
      - name: Install dotfiles with base profile
        shell: pwsh
        # Skip unavailable external installers: winget installs fail inside CI
        # and windows-latest does not provide a VS Code CLI launcher. This job
        # validates the git symlink and config chain instead.
        run: .\bin\dotfiles.exe update --root . -p base -v --skip agent-packages,packages,vscode-extensions
      - name: Test ${{ matrix.application }}
        shell: pwsh
        env:
          DIR: ${{ github.workspace }}
        run: ./.github/workflows/scripts/windows/Test-Applications.ps1 ${{ matrix.application }} ${{ matrix.tests }}

  # ── Specialized Tests ─────────────────────────────────
  test-git-hooks:
    name: "Security: Pre-commit Sensitive Data Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_git_hooks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and test pre-commit hook
        run: |
          git config user.name "CI Test"
          git config user.email "ci@test.local"
          ln -sf "$(pwd)/hooks/pre-commit" .git/hooks/pre-commit
          chmod +x .git/hooks/pre-commit
          .github/workflows/scripts/linux/test-git-hooks.sh

  test-shell-wrapper-linux:
    name: "Shell Wrapper: Linux (dotfiles.sh)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_wrapper_linux == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Run shell wrapper tests
        env:
          DIR: ${{ github.workspace }}
          BINARY_PATH: ${{ github.workspace }}/bin/dotfiles
        run: sh .github/workflows/scripts/linux/test-shell-wrapper.sh

  test-shell-wrapper-windows:
    name: "Shell Wrapper: Windows (dotfiles.ps1)"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_wrapper_windows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: bash
        run: sh .github/workflows/scripts/linux/ci-fixture-home.sh
      - name: Run PowerShell wrapper tests
        shell: pwsh
        env:
          BINARY_PATH: ${{ github.workspace }}/bin/dotfiles.exe
        run: ./.github/workflows/scripts/windows/Test-ShellWrapper.ps1

  # ── CI Gate ───────────────────────────────────────────
  ci-success:
    name: "All CI Checks Passed"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    needs:
      - classify-changes
      - rust-fmt
      - lint
      - managed-script-regressions
      - desktop-qml
      - docs
      - validate-config
      - audit
      - deny
      - build-linux
      - msrv
      - mutation
      - mutation-windows
      - build-windows
      - integration-linux
      - integration-windows
      - test-install-uninstall
      - test-install-uninstall-windows
      - test-applications
      - test-applications-windows
      - test-git-hooks
      - test-shell-wrapper-linux
      - test-shell-wrapper-windows
      - test-stocks
      - test-hook-inputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check all jobs passed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/workflows/scripts/linux/check-ci-contract.py --results
