name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  classify-changes:
    name: "CI: Classify changes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_docs_checks: ${{ steps.classify.outputs.run_docs_checks }}
      run_docs_site: ${{ steps.classify.outputs.run_docs_site }}
      run_docs_contracts: ${{ steps.classify.outputs.run_docs_contracts }}
      run_lint: ${{ steps.classify.outputs.run_lint }}
      lint_matrix: ${{ steps.classify.outputs.lint_matrix }}
      run_validate_config: ${{ steps.classify.outputs.run_validate_config }}
      run_apm: ${{ steps.classify.outputs.run_apm }}
      run_apm_windows: ${{ steps.classify.outputs.run_apm_windows }}
      run_config_drift: ${{ steps.classify.outputs.run_config_drift }}
      run_rust_checks: ${{ steps.classify.outputs.run_rust_checks }}
      run_rust_fmt: ${{ steps.classify.outputs.run_rust_fmt }}
      run_audit: ${{ steps.classify.outputs.run_audit }}
      run_deny: ${{ steps.classify.outputs.run_deny }}
      run_build_linux: ${{ steps.classify.outputs.run_build_linux }}
      run_build_windows: ${{ steps.classify.outputs.run_build_windows }}
      run_profile_linux: ${{ steps.classify.outputs.run_profile_linux }}
      run_profile_windows: ${{ steps.classify.outputs.run_profile_windows }}
      run_roundtrip_linux: ${{ steps.classify.outputs.run_roundtrip_linux }}
      run_roundtrip_windows: ${{ steps.classify.outputs.run_roundtrip_windows }}
      run_app_tests: ${{ steps.classify.outputs.run_app_tests }}
      run_app_windows: ${{ steps.classify.outputs.run_app_windows }}
      app_matrix: ${{ steps.classify.outputs.app_matrix }}
      run_git_hooks: ${{ steps.classify.outputs.run_git_hooks }}
      run_hook_inputs: ${{ steps.classify.outputs.run_hook_inputs }}
      run_wrapper_linux: ${{ steps.classify.outputs.run_wrapper_linux }}
      run_wrapper_windows: ${{ steps.classify.outputs.run_wrapper_windows }}
      run_desktop_scripts: ${{ steps.classify.outputs.run_desktop_scripts }}
      run_prompt: ${{ steps.classify.outputs.run_prompt }}
      run_lock: ${{ steps.classify.outputs.run_lock }}
      run_desktop_qml: ${{ steps.classify.outputs.run_desktop_qml }}
      run_desktop_python: ${{ steps.classify.outputs.run_desktop_python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine comparison range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/workflows/scripts/linux/ci-comparison-range.sh
      - name: Find the last published documentation
        if: github.event_name == 'push'
        id: published-docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/workflows/scripts/docs-publication-base.py
      - name: Classify changed paths
        id: classify
        env:
          DIR: ${{ github.workspace }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
          CI_FORCE_FULL: ${{ steps.range.outputs.force_full }}
          DOCS_BASE_SHA: ${{ steps.published-docs.outputs.base_sha }}
        run: python3 -B .github/workflows/scripts/classify-ci-changes.py
      - name: Scan commit range for sensitive data
        if: steps.range.outputs.base_sha != '' && steps.range.outputs.head_sha != ''
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        run: sh hooks/check-sensitive.sh --range "$BASE_SHA" "$HEAD_SHA"
      - name: Install actionlint
        run: |
          sh .github/workflows/scripts/linux/install-actionlint.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sh .github/workflows/scripts/linux/install-apt-packages.sh shellcheck
          fi
      - name: Check workflow syntax and expressions
        run: python3 -B .github/workflows/scripts/check_lint.py workflows
      - name: Check CI job gate
        run: python3 -B .github/workflows/scripts/check-ci-contract.py
      - name: Test change classification and release selection
        run: python3 -B .github/workflows/scripts/test_ci_changes.py

  # ── Rust Format Check ──────────────────────────────────
  rust-fmt:
    name: "Rust: Format Check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_rust_fmt == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --check

  # ── Script Linting ────────────────────────────────────
  lint:
    name: "Lint: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_lint == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ${{ matrix.name }}
        run: ${{ matrix.setup }}
      - name: Run ${{ matrix.name }}
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B .github/workflows/scripts/check_lint.py ${{ matrix.check }}

  powershell-prompt:
    name: "Regression: PowerShell prompt (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_prompt == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell profile behavior
        shell: pwsh
        run: ./tests/shell/Test-Prompt.ps1

  desktop-script-regressions:
    name: "Regression: Desktop scripts"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_desktop_scripts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install desktop-script regression tools
        if: needs.classify-changes.outputs.run_lock == 'true'
        run: sh .github/workflows/scripts/linux/install-apt-packages.sh lua5.4 jq libglib2.0-bin
      - name: Check desktop script behavior
        if: needs.classify-changes.outputs.run_lock == 'true'
        run: python3 -B tests/runner.py --strict tests/desktop/hypr
      - name: Check Quickshell Python helpers
        if: needs.classify-changes.outputs.run_desktop_python == 'true'
        run: python3 -B tests/runner.py --strict tests/desktop/quickshell/python

  desktop-qml:
    name: "Regression: Quickshell QML"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_desktop_qml == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt Quick Test
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: linux_gcc_64
      - name: Test QML with inert Quickshell mocks
        run: sh tests/desktop/quickshell/test-desktop-qml.sh
      - name: Start Quickshell in a disposable Wayland session
        run: >-
          docker run --rm --init --volume "$GITHUB_WORKSPACE:/workspace:ro"
          archlinux@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
          sh /workspace/tests/desktop/quickshell/test-desktop-session.sh

  # ── Documentation Consistency ─────────────────────────
  docs-links:
    name: "Docs: Links and skills"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_docs_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository links and skill metadata
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B .github/workflows/scripts/check_docs.py links

  docs-contracts:
    name: "Docs: Rust contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_docs_contracts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: cd cli && rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
      - name: Check documented examples and selectors
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B .github/workflows/scripts/check_docs.py contracts

  docs:
    name: "Docs: Content and site"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_docs_site == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm --prefix docs ci --no-audit --no-fund
      - name: Audit documentation dependencies
        run: npm --prefix docs audit
      - name: Install browser test runtime
        working-directory: docs
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check documentation consistency
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B .github/workflows/scripts/check_docs.py site
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-failures
          path: docs/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the verified documentation site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/dist/
          if-no-files-found: error
          retention-days: 7

  # ── Configuration Validation ──────────────────────────
  validate-config:
    name: "Config: Validate all"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_validate_config == 'true' && needs.build-linux.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Run typed configuration validation
        run: ./bin/dotfiles check --root . -p desktop --only config-diagnostics,symlink-sources,config-files
      - name: Set up APM
        if: needs.classify-changes.outputs.run_apm == 'true'
        uses: microsoft/apm-action@64544310be26812256300543071bfbaa8bc93aad # v1.12.0
        with:
          setup-only: 'true'
          apm-version: '0.37.0'
      - name: Verify public agent package deployment
        if: needs.classify-changes.outputs.run_apm == 'true'
        run: python3 -B tests/integration/test_apm.py --strict bin/dotfiles

  test-hook-inputs:
    name: "Regression: Isolated hook inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_hook_inputs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test staged inputs and repository isolation
        run: python3 -B tests/hooks/test_hook_inputs.py --strict --skip-build-triggers

  # ── Security ──────────────────────────────────────────
  audit:
    name: "Security: Cargo Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_audit == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
      - run: cargo audit

  deny:
    name: "Security: Cargo Deny"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_deny == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check all

  # ── Build, Clippy & Test ──────────────────────────────
  build-linux:
    name: "Build: Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_build_linux == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Build CI binary
        if: needs.classify-changes.outputs.run_rust_checks != 'true' && needs.classify-changes.outputs.run_config_drift != 'true'
        run: cargo build --locked --profile ci
      - name: Clippy
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo clippy --locked --profile ci --all-targets -- -D warnings
      - name: Tests
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo test --locked --profile ci
      - name: Rustdoc
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --profile ci --no-deps --document-private-items
      - name: Configuration drift tests
        if: needs.classify-changes.outputs.run_config_drift == 'true' && needs.classify-changes.outputs.run_rust_checks != 'true'
        run: cargo test --locked --profile ci --test config_drift
      - name: Test build-version Git dependencies
        if: needs.classify-changes.outputs.run_rust_checks == 'true' || needs.classify-changes.outputs.run_hook_inputs == 'true'
        run: python3 -B ../tests/hooks/test_hook_inputs.py --strict test_build_version_ref_triggers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-linux
          path: cli/target/ci/dotfiles
          retention-days: 1

  # ── MSRV (Minimum Supported Rust Version) ─────────────
  msrv:
    name: "Rust: MSRV"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_rust_checks == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve MSRV
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$msrv" ]]; then
            echo "Cargo.toml does not declare rust-version." >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Check against MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked --profile ci --all-targets

  # ── Coverage (informational, non-gating) ──────────────
  coverage:
    name: "Rust: Coverage (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: true
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_rust_checks == 'true'
    defaults:
      run:
        working-directory: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --locked --profile ci --all-targets --summary-only
      - name: Generate HTML coverage report
        run: cargo llvm-cov report --profile ci --html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-coverage-${{ matrix.name }}
          path: cli/target/llvm-cov/html
          if-no-files-found: ignore
          retention-days: 7

  build-windows:
    name: "Build: Windows"
    runs-on: windows-latest
    timeout-minutes: 120
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_build_windows == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disable Windows Defender real-time monitoring
        continue-on-error: true
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          } catch {
            Write-Host "Could not disable Defender real-time monitoring (likely tamper protection); continuing: $_"
          }
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      # Full tests build target/ci/dotfiles.exe for Rust changes. Non-Rust
      # changes still need an artifact for the downstream Windows jobs.
      - name: Build CI binary
        if: needs.classify-changes.outputs.run_rust_checks != 'true'
        run: cargo build --locked --profile ci
      - name: Clippy
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo clippy --locked --profile ci --all-targets -- -D warnings
      - name: Tests
        if: needs.classify-changes.outputs.run_rust_checks == 'true'
        run: cargo test --locked --profile ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-windows
          path: cli/target/ci/dotfiles.exe
          retention-days: 1

  # ── Integration Tests ─────────────────────────────────
  integration-linux:
    name: "Integration: ${{ matrix.profile }} on Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_profile_linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile: [base, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Create an empty fixture home
        run: python3 -B .github/workflows/scripts/ci_fixture_home.py
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Dry-run update
        # Test the triggering checkout with no repository sync or external APM installer.
        run: ./bin/dotfiles update --root . -p ${{ matrix.profile }} -n --no-repo-update --skip agent-packages,vscode-extensions
      - name: Run validation
        # APM is not provisioned in this matrix.
        run: ./bin/dotfiles check --root . -p ${{ matrix.profile }} --skip apm-plugins

  integration-windows:
    name: "Integration: ${{ matrix.profile }} on Windows"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_profile_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile: [base, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: pwsh
        run: python -B .github/workflows/scripts/ci_fixture_home.py
      - name: Dry-run update
        # Test the triggering checkout with no repository sync or external APM installer.
        shell: pwsh
        run: .\bin\dotfiles.exe update --root . -p ${{ matrix.profile }} -n --no-repo-update --skip agent-packages,vscode-extensions
      - name: Run validation
        shell: pwsh
        # APM is not provisioned in this matrix.
        run: .\bin\dotfiles.exe check --root . -p ${{ matrix.profile }} --skip apm-plugins

  test-install-uninstall:
    name: "Integration: Install/Uninstall round-trip"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_roundtrip_linux == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Create an empty fixture home
        run: python3 -B .github/workflows/scripts/ci_fixture_home.py
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Run install/uninstall round-trip test
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B tests/integration/test_install_uninstall.py --strict bin/dotfiles
      - name: Check native Arch convergence and recovery
        run: >-
          docker run --rm --init --volume "$GITHUB_WORKSPACE:/workspace:ro"
          archlinux@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
          sh /workspace/tests/integration/test-arch-acceptance.sh

  test-install-uninstall-windows:
    name: "Integration: Install/Uninstall round-trip (Windows)"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_roundtrip_windows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: pwsh
        run: python -B .github/workflows/scripts/ci_fixture_home.py
      - name: Run install/uninstall round-trip test
        shell: pwsh
        env:
          DIR: ${{ github.workspace }}
        run: python -B tests/integration/test_install_uninstall.py --strict bin/dotfiles.exe

  test-apm-windows:
    name: "Integration: APM (Windows)"
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_apm_windows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      # microsoft/apm-action does not support Windows (win32); install the
      # matching upstream release archive directly with SHA-256 verification.
      - name: Set up APM
        shell: pwsh
        run: .github/workflows/scripts/windows/Install-Apm.ps1 -Version 0.37.0
      - name: Verify public agent package deployment
        shell: pwsh
        run: python -B tests/integration/test_apm.py --strict bin/dotfiles.exe

  # ── Application Tests ─────────────────────────────────
  test-applications:
    name: "App: ${{ matrix.application }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_app_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.app_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create an empty fixture home
        run: python3 -B .github/workflows/scripts/ci_fixture_home.py
      - name: Install ${{ matrix.packages }}
        run: sh .github/workflows/scripts/linux/install-apt-packages.sh ${{ matrix.packages }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Install dotfiles with base profile
        run: ./bin/dotfiles update --root . -p base -v --no-repo-update --skip agent-packages
      - name: Test ${{ matrix.application }} isolated configuration
        if: matrix.config_script != ''
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B ${{ matrix.config_script }} --strict ${{ matrix.config_args }}
      - name: Test ${{ matrix.application }}
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B ${{ matrix.script }} --strict ${{ matrix.tests }}

  # Windows counterpart. Only git is covered: zsh, vim, and nvim are excluded
  # from the Windows profile, so they have no Windows equivalent to test.
  test-applications-windows:
    name: "App: ${{ matrix.application }} (Windows)"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_app_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: Git
            tests: config aliases behavior clean hooks delta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: pwsh
        run: python -B .github/workflows/scripts/ci_fixture_home.py
      - name: Install dotfiles with base profile
        shell: pwsh
        # Skip unavailable external installers: winget installs fail inside CI
        # and windows-latest does not provide a VS Code CLI launcher. This job
        # validates the git symlink and config chain instead.
        run: .\bin\dotfiles.exe update --root . -p base -v --no-repo-update --skip agent-packages,packages,vscode-extensions
      - name: Test ${{ matrix.application }}
        shell: pwsh
        env:
          DIR: ${{ github.workspace }}
        run: python -B tests/integration/test_git.py --strict ${{ matrix.tests }}

  # ── Specialized Tests ─────────────────────────────────
  test-git-hooks:
    name: "Security: Pre-commit Sensitive Data Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes]
    if: needs.classify-changes.outputs.run_git_hooks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test pre-commit hook
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B tests/hooks/test_git_hooks.py --strict
      - name: Test Git maintenance templates and cleanup
        env:
          DIR: ${{ github.workspace }}
        run: python3 -B tests/hooks/test_maintenance.py --strict

  test-shell-wrapper-linux:
    name: "Shell Wrapper: Linux (dotfiles.sh)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes, build-linux]
    if: needs.classify-changes.outputs.run_wrapper_linux == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-linux
          path: bin/
      - name: Make binary executable
        run: chmod +x bin/dotfiles
      - name: Verify wrapper parity contract
        run: python3 -B tests/wrapper/test_parity.py --strict
      - name: Run shell wrapper tests
        env:
          DIR: ${{ github.workspace }}
          BINARY_PATH: ${{ github.workspace }}/bin/dotfiles
        run: python3 -B tests/wrapper/test_shell_wrapper_linux.py --strict --prebuilt

  test-shell-wrapper-windows:
    name: "Shell Wrapper: Windows (dotfiles.ps1)"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes, build-windows]
    if: needs.classify-changes.outputs.run_wrapper_windows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotfiles-windows
          path: bin/
      - name: Create an empty fixture home
        shell: pwsh
        run: python -B .github/workflows/scripts/ci_fixture_home.py
      - name: Verify wrapper parity contract
        shell: pwsh
        run: python -B tests/wrapper/test_parity.py --strict
      - name: Run PowerShell wrapper tests
        shell: pwsh
        env:
          BINARY_PATH: ${{ github.workspace }}/bin/dotfiles.exe
        run: ./tests/wrapper/Test-ShellWrapper.ps1

  # ── CI Gate ───────────────────────────────────────────
  ci-success:
    name: "All CI Checks Passed"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    needs:
      - classify-changes
      - rust-fmt
      - lint
      - powershell-prompt
      - desktop-script-regressions
      - desktop-qml
      - docs
      - docs-links
      - docs-contracts
      - validate-config
      - audit
      - deny
      - build-linux
      - msrv
      - build-windows
      - integration-linux
      - integration-windows
      - test-install-uninstall
      - test-install-uninstall-windows
      - test-apm-windows
      - test-applications
      - test-applications-windows
      - test-git-hooks
      - test-shell-wrapper-linux
      - test-shell-wrapper-windows
      - test-hook-inputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all jobs passed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B .github/workflows/scripts/check-ci-contract.py --results
