name: Mutation Testing

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
    inputs:
      mutation_base:
        description: "Optional ancestor SHA to replay; manual runs do not advance the nightly baseline"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: "Mutation: Select accumulated changes"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      run_linux: ${{ steps.plan.outputs.run_linux }}
      linux_matrix: ${{ steps.plan.outputs.linux_matrix }}
      run_windows: ${{ steps.select.outputs.run_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select mutation inputs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_BASE: ${{ inputs.mutation_base }}
        run: python3 -B .github/workflows/scripts/linux/select-mutations.py
      - name: Install Rust toolchain for mutant discovery
        if: steps.select.outputs.has_linux_inputs == 'true'
        working-directory: cli
        run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: steps.select.outputs.has_linux_inputs == 'true'
        with:
          tool: cargo-mutants@27.1.0
      - name: Plan Linux shards
        id: plan
        run: python3 -B .github/workflows/scripts/linux/run-mutations.py plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-inputs
          path: |
            cli/mutation-plan.json
            cli/mutants.diff
          if-no-files-found: error
          retention-days: 7

  mutation:
    name: "Rust: Mutation (changed code, shard ${{ matrix.id }})"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [select]
    if: needs.select.outputs.run_linux == 'true'
    strategy:
      fail-fast: false
      # Leave runner capacity for ordinary CI while the nightly replay runs.
      max-parallel: 14
      matrix: ${{ fromJSON(needs.select.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-inputs
          path: cli/
      - name: Install Rust toolchain
        working-directory: cli
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - name: Install cargo-mutants
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants@27.1.0
      - name: Test selected Linux mutations
        env:
          MUTATION_SUITE: ${{ matrix.suite }}
          MUTATION_PARTITION: ${{ matrix.partition }}
        run: >-
          python3 -B .github/workflows/scripts/linux/run-mutations.py
          run "$MUTATION_SUITE" --partition "$MUTATION_PARTITION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-mutation-results-${{ matrix.id }}
          path: cli/mutants.out
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-result-${{ matrix.id }}
          path: |
            cli/mutants.out/outcomes.json
            cli/mutants.out/missed.txt
            cli/mutants.out/timeout.txt
          if-no-files-found: error
          retention-days: 7

  mutation-windows:
    name: "Rust: Native Windows mutation (shard ${{ matrix.shard }})"
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [select]
    if: needs.select.outputs.run_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "cli -> target"
          cache-on-failure: true
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants@27.1.0
      - name: Check native registry, PATH and elevation contracts
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        run: >-
          python -B ../.github/workflows/scripts/linux/run-mutations.py
          run windows --partition "$env:MUTATION_SHARD/2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-mutation-results-windows-${{ matrix.shard }}
          path: cli/mutants.out
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-result-windows-${{ matrix.shard }}
          path: |
            cli/mutants.out/outcomes.json
            cli/mutants.out/missed.txt
            cli/mutants.out/timeout.txt
          if-no-files-found: error
          retention-days: 7

  mutation-results:
    name: "Mutation: Results"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [select, mutation, mutation-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.select.result == 'success'
        with:
          name: mutation-inputs
          path: mutation-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always() && (needs.select.outputs.run_linux == 'true' || needs.select.outputs.run_windows == 'true')
        with:
          pattern: mutation-result-*
          path: mutation-results
      - name: Report selected mutation results
        if: always()
        env:
          MUTATION_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 -B .github/workflows/scripts/linux/report-mutations.py
          mutation-inputs/mutation-plan.json mutation-results mutation-summary.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-summary
          path: mutation-summary.md
          if-no-files-found: error
          retention-days: 7
