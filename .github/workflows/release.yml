name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  # Allows cutting a release by hand (e.g. to re-cut after an infrastructure
  # failure) from a specific successful CI run without pushing an empty commit.
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI workflow run ID to release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

# Release builds intentionally avoid dependency caches so checked-out code never
# receives cache write credentials in this privileged workflow.
jobs:
  check-ci:
    name: Check CI succeeded
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve tested commit
        id: resolve
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "CI workflow passed for $EVENT_HEAD_SHA; proceeding with release."
            exit 0
          fi

          if [[ -z "$CI_RUN_ID" || "$CI_RUN_ID" == *[!0-9]* ]]; then
            echo "ci_run_id must be a numeric GitHub Actions run ID." >&2
            exit 1
          fi

          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          name="$(jq -r '.name' <<< "$run")"
          path="$(jq -r '.path' <<< "$run")"
          status="$(jq -r '.status' <<< "$run")"
          conclusion="$(jq -r '.conclusion' <<< "$run")"
          event="$(jq -r '.event' <<< "$run")"
          branch="$(jq -r '.head_branch' <<< "$run")"
          repository="$(jq -r '.head_repository.full_name' <<< "$run")"
          sha="$(jq -r '.head_sha' <<< "$run")"

          if [[ "$name" != "CI" || "$path" != ".github/workflows/ci.yml" ||
                "$status" != "completed" || "$conclusion" != "success" ||
                "$event" != "push" || "$branch" != "main" || "$repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "CI run $CI_RUN_ID is not a successful canonical CI push to main from this repository." >&2
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated CI run $CI_RUN_ID for $sha; proceeding with release."

  # Resolves the release identity (version tag + commit) exactly once so every
  # downstream job builds, attests, and tags the same thing.
  #
  # Versions are date-based: vYYYY.MM.DD-N, where N starts at 1 and increments
  # for each additional release cut on the same UTC day. The crate version in
  # cli/Cargo.toml is intentionally not the release version; it only backs the
  # `dev-` fallback for local builds.
  version:
    name: Resolve release version
    needs: [check-ci]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-ci.outputs.sha }}
          fetch-depth: 0

      - name: Resolve version and commit
        id: resolve
        env:
          HEAD_SHA: ${{ needs.check-ci.outputs.sha }}
        run: |
          set -euo pipefail
          date_part="$(date -u +%Y.%m.%d)"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/v${date_part}-${n}" >/dev/null 2>&1; do
            n=$((n + 1))
          done
          version="v${date_part}-${n}"
          echo "Resolved release version: $version (commit $HEAD_SHA)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: [check-ci, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            artifact: dotfiles-linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: dotfiles-linux-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show

      - name: Build release binary
        run: cargo build --release --locked --manifest-path cli/Cargo.toml
        env:
          DOTFILES_VERSION: ${{ needs.version.outputs.version }}

      - name: Rename binary
        run: cp cli/target/release/dotfiles "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-windows:
    name: Build Windows x86_64
    needs: [check-ci, version]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show

      - name: Build release binary
        run: cargo build --release --locked --manifest-path cli/Cargo.toml
        env:
          DOTFILES_VERSION: ${{ needs.version.outputs.version }}

      - name: Rename binary
        run: Copy-Item cli\target\release\dotfiles.exe dotfiles-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotfiles-windows-x86_64
          path: dotfiles-windows-x86_64.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-linux, build-windows]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Ensure release tag is unused
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "Release tag $VERSION already exists." >&2
            exit 1
          fi

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotfiles-linux-x86_64

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotfiles-linux-aarch64

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotfiles-windows-x86_64

      - name: Generate checksums
        run: |
          sha256sum dotfiles-linux-x86_64 dotfiles-linux-aarch64 dotfiles-windows-x86_64.exe > checksums.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dotfiles-linux-x86_64
            dotfiles-linux-aarch64
            dotfiles-windows-x86_64.exe

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body: |
            Automated release.
            Commit: ${{ needs.version.outputs.sha }}
          files: |
            dotfiles-linux-x86_64
            dotfiles-linux-aarch64
            dotfiles-windows-x86_64.exe
            checksums.sha256
