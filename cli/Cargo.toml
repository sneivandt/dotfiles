[package]
name = "dotfiles-cli"
# Not the release version. Releases are tagged `vYYYY.MM.DD-N` by
# .github/workflows/release.yml and injected via DOTFILES_VERSION; this value
# only backs the `dev-` fallback reported by local builds.
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Cross-platform dotfiles management engine"
license = "MIT"
publish = false

[[bin]]
name = "dotfiles"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = "3.5"
dunce = "1"
thiserror = "2"
enable-ansi-support = "0.3"
git2 = "0.21.0"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
tracing = "0.1"
ureq = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8.0.3"
terminal_size = "0.4.4"
serde_yaml_ng = "0.10.0"
unicode-width = "0.2"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
mockall = "0.15"
proptest = "1"
tempfile = "3"
# tests/domain_boundaries.rs parses src/ as a syntax tree instead of scanning it
# as text. `span-locations` is what makes line numbers available outside a
# proc-macro context, so violations can still be reported as `file:line`.
#
# Both are pinned to a minimal feature set. The test only parses files and walks
# them with a visitor, so `syn`'s default `derive`, `printing`, `clone-impls`,
# and `proc-macro` features are dead weight; dropping them cuts the compile cost
# of this stack by roughly a third (measured at `opt-level = 1`: ~31s CPU / ~8.3s
# wall down to ~21s CPU / ~5.6s wall).
#
# Known cost: these feature sets do not unify with the host copies that every
# derive macro in the tree builds against, so `cargo test` compiles one extra
# `syn` and one extra `proc-macro2` unit. That cost lands on cold builds only.
# The units coexist rather than replace each other, so alternating `cargo build`
# and `cargo test` does not invalidate either one — verified on the `dev` and
# `ci` profiles, where the second command recompiles nothing. Moving the test to
# its own package would keep those units out of lint-only and coverage-only
# commands, but it cannot help the commands that actually run the test, so it is
# not worth the workspace plumbing.
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal", "user"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
# `unreachable_pub` (rust lint) and `redundant_pub_crate` give contradictory
# advice for `pub(crate) mod foo; pub fn bar` patterns. We prefer
# `pub(crate)` everywhere internal so consumers can see the true API surface.
redundant_pub_crate = "allow"
# Restriction lints (opt-in individually)
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
empty_structs_with_brackets = "deny"
expect_used = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
missing_assert_message = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
shadow_unrelated = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

[lints.rust]
dead_code = "deny"
explicit_outlives_requirements = "deny"
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused_extern_crates = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"

[profile.dev.package."*"]
opt-level = 3

[profile.dev-opt]
inherits = "dev"
opt-level = 1
incremental = false
codegen-units = 256
debug = 0

[profile.ci]
inherits = "dev"
opt-level = 1
lto = false
codegen-units = 256
debug = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
