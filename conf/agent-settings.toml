# Agent harness settings
#
# Each `[<category>.<target>]` table converges leaf keys in one harness's user
# settings document (nested tables and dotted keys flatten to dot-separated paths):
#   copilot -> ~/.copilot/settings.json (JSON)
#   codex   -> ~/.codex/config.toml      (TOML)
#
# Only listed leaf keys are managed. Volatile harness state, credentials, integrations,
# and every other key are preserved. Agent package deployment is a separate task:
# dotfiles merges symlinks/apm/config/*.yml, invokes APM, and reconciles its
# Copilot App and Cowork adapters. See docs/content/guides/agent-configuration.md for ownership.

[base.copilot]
# Model, session, and input defaults
model = "gpt-6.2-sol"
effortLevel = "medium"
banner = "never"
beep = false
memory = true
renderMarkdown = true
logLevel = "default"
commandHistoryMaxSize = 200
editorMode = "normal"
defaultMode = "interactive"

# Appearance
theme = "default"

[base.copilot.footer]
showModelEffort = false
showDirectory = true
showBranch = true
showContextWindow = false
showQuota = false
showAiUsed = false
showAgent = true
showCodeChanges = true
showUsername = false
showSandbox = false
showCustom = true

[base.codex]
# Permissions shared by the CLI, IDE extension, and desktop app
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = ":workspace"

# Memory generation and use
features.memories = true
memories.generate_memories = true
memories.use_memories = true

# Model and tool defaults
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
web_search = "live"
file_opener = "vscode-insiders"

# Keep the default exclusions when passing environment variables to tools.
shell_environment_policy.ignore_default_excludes = false

[base.codex.tui]
# Show directory, branch, and remaining context. Preserve terminal scrollback.
status_line = ["current-dir", "git-branch", "context-remaining"]
alternate_screen = "never"
show_tooltips = false

# Resume in the saved session directory; notify only while unfocused.
resume_cwd = "session"
notifications = true
notification_condition = "unfocused"

[base.codex.desktop]
# App-specific keys may change between releases
notifications-sound = "none"
followUpQueueMode = "steer"
show-context-window-usage = true
ambient-suggestions-enabled = false

[desktop.copilot]
# Keep CLI sessions connected to the editor and review edit diffs there.
ide.autoConnect = true
ide.openDiffOnEdit = true

[linux.copilot]
# Linux package management owns CLI updates. Also disable first-party plugin auto-updates.
autoUpdate = false

[windows.copilot]
# Windows allows CLI and first-party plugin auto-updates.
autoUpdate = true
