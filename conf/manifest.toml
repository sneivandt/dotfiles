# Manifest file for sparse checkout configuration
# Lists which files belong to exclusion categories: linux, windows, arch, desktop
#
# IMPORTANT: Every non-[base] category section in symlinks.toml must have a
# corresponding section here. The validation task ('dotfiles check') checks this.
#
# Format: paths relative to symlinks/ directory (prefix not included in paths)
# These paths are prefixed with symlinks/ when generating sparse checkout patterns
# Directories should end with /
# Individual files listed explicitly
#
# Section names use hyphen-separated categories and follow the same AND logic
# as other config files. A path is retained when at least one section declaring
# it is active; otherwise it is excluded.
#
# Files in the [base] category do not need to be listed here because base is
# always active. Only list files owned by categories that can be inactive.

# Linux-specific files (excluded on Windows)
[linux]
paths = [
  "bash_profile",
  "bashrc",
  "config/bash/",
  "config/nuget/",
  "config/readline/",
  "config/shell/aliases.sh",
  "config/shell/path.sh",
  "config/shell/profile.sh",
  "config/systemd/user/clean-home-tmp.service",
  "config/systemd/user/clean-home-tmp.timer",
  "config/tmux/",
  "config/wgetrc",
  "config/zsh/",
  "gnupg/",
  "vim/",
  "zprofile",
  "zshrc",
]

# Arch Linux-specific files
[arch]
paths = [
  "apm/config/arch.yml",
  "config/pacman.conf",
  "config/paru/",
  "config/zsh/functions/update-mirrors",
]

# Desktop-specific files that also require Arch Linux
[arch-desktop]
paths = [
  "config/alacritty/",
  "config/autostart/nm-applet.desktop",
  "config/chromium-flags.conf",
  "config/fuzzel/",
  "config/gammastep/",
  "config/gtk-2.0/",
  "config/gtk-3.0/",
  "config/gtk-4.0/",
  "config/hypr/",
  "config/mako/",
  "config/shell/profile-arch-desktop.sh",
  "config/spotify-flags.conf",
  "config/systemd/user/clean-screenshots.service",
  "config/systemd/user/clean-screenshots.timer",
  "config/systemd/user/dotfiles-first-login.service",
  "config/systemd/user/fullscreen-waybar.service",
  "config/systemd/user/gammastep.service",
  "config/systemd/user/hypridle.service",
  "config/systemd/user/hyprpaper.service",
  "config/systemd/user/mako.service",
  "config/systemd/user/network-manager-applet.service",
  "config/systemd/user/volume.service",
  "config/systemd/user/waybar.service",
  "config/systemd/user/waybar-workspaces.service",
  "config/user-dirs.conf",
  "config/user-dirs.dirs",
  "config/volume/",
  "config/wallpaper/",
  "config/waybar/",
  "local/bin/code-insiders",
]

# Desktop-specific files (excluded on non-desktop)
[desktop]
paths = [
  # Cross-platform backing store for VS Code, VS Code Insiders, and Remote.
  "config/Code/",
]

# Desktop-specific files that also require Linux
[linux-desktop]
paths = [
  "config/shell/aliases-desktop.sh",
  "config/shell/profile-desktop.sh",
  "local/share/applications/",
]

# Windows-specific files
[windows]
paths = [
  "config/git/windows",
  "config/nuget/",
  "wslconfig",
]

# Windows desktop-specific files
[windows-desktop]
paths = [
  "AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json",
]
