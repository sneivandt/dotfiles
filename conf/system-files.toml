# Privileged system files are selected with the same profile and environment
# categories as the rest of the configuration.

[linux]
files = [
  { source = "codex/requirements.toml", merge = "toml" },
]

[arch]
files = [
  { source = "pacman.conf", merge = "ini" },
]

[arch-desktop]
files = [
  { source = "pam.d/login", merge = "pam" },
  { source = "pam.d/passwd", merge = "pam" },
]

[wsl]
files = [
  { source = "wsl.conf", merge = "ini" },
]
