# Systemd user and system units to enable and start
# Each section is a category conjunction

[linux]
units = [
  "clean-home-tmp.timer",
]

# Packaged weekly maintenance timers. Reflector uses
# /etc/xdg/reflector/reflector.conf for mirror selection.
[arch]
units = [
  { name = "fstrim.timer", scope = "system" },
  { name = "paccache.timer", scope = "system" },
  { name = "reflector.timer", scope = "system" },
]

[arch-desktop]
units = [
  { name = "NetworkManager.service", scope = "system" },
  { name = "dhcpcd.service", scope = "system", enabled = false },
  "clean-screenshots.timer",
  "dotfiles-first-login.service",
  "gammastep.service",
  "gnome-keyring-daemon.socket",
  "hypridle.service",
  "hyprpaper.service",
  "hyprpolkitagent.service",
  "mako.service",
  { name = "network-manager-applet.service", scope = "user", enabled = false },
  "quickshell.service",
  "xdg-user-directories.service",
]
