# Systemd user units to enable and start
# Each section represents a profile

[linux]
units = [
  "clean-home-tmp.timer",
]

[arch-desktop]
units = [
  { name = "NetworkManager.service", scope = "system" },
  "clean-screenshots.timer",
  "dotfiles-first-login.service",
  "fullscreen-waybar.service",
  "gammastep.service",
  "hypridle.service",
  "hyprpaper.service",
  "mako.service",
  "network-manager-applet.service",
  "volume.service",
  "waybar.service",
  "waybar-workspaces.service",
]
