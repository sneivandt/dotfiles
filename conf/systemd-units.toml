# Systemd user and system units to enable and start
# Each section is a category conjunction

[linux]
units = [
  "clean-home-tmp.timer",
]

# Packaged weekly maintenance timers. Reflector uses
# /etc/xdg/reflector/reflector.conf for mirror selection.
[arch]
units = [
  { name = "fstrim.timer", scope = "system" },
  { name = "paccache.timer", scope = "system" },
  { name = "reflector.timer", scope = "system" },
]

[arch-desktop]
units = [
  { name = "NetworkManager.service", scope = "system" },
  "clean-screenshots.timer",
  { name = "dotfiles-first-login.service", scope = "user", graphical = true },
  { name = "gammastep.service", scope = "user", graphical = true },
  "gnome-keyring-daemon.socket",
  { name = "gtk-settings.service", scope = "user", graphical = true },
  { name = "hypridle.service", scope = "user", graphical = true },
  { name = "hyprpaper.service", scope = "user", graphical = true },
  { name = "hyprpolkitagent.service", scope = "user", graphical = true },
  { name = "mako.service", scope = "user", graphical = true },
  { name = "network-manager-applet.service", scope = "user", enabled = false, graphical = true },
  { name = "quickshell.service", scope = "user", graphical = true },
  { name = "thunar-view-settings.service", scope = "user", graphical = true },
  { name = "xdg-user-directories.service", scope = "user", graphical = true },
]
