title: Dotfiles
description: Configuration and CLI guides for Stuart Neivandt's Arch Linux and Windows setup.
url: "https://dotfiles.stuartneivandt.com"
baseurl: ""
repository: sneivandt/dotfiles
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

# Include guides that GitHub Pages otherwise treats as repository metadata.
include:
  - README.md
  - CONTRIBUTING.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

color_scheme: dark
nav_enabled: true
search_enabled: true
heading_anchors: true
enable_copy_code_button: true
mermaid:
  version: "11.12.0"

aux_links:
  "GitHub repository":
    - https://github.com/sneivandt/dotfiles

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/sneivandt/dotfiles
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

back_to_top: true
back_to_top_text: Back to top
