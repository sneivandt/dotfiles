    <linearGradient id="backdrop" x2="1" y2="1">
      <stop stop-color="#24283b"/>
      <stop offset="1" stop-color="#151621"/>
    </linearGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1">
      <stop stop-color="#bb9af7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="1" cy="1" r="0.8">
      <stop stop-color="#7aa2f7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terminal" x2="0" y2="1">
      <stop stop-color="#1c1e2d"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="chrome" x2="0" y2="1">
      <stop stop-color="#2a2e43"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="border" x2="0.8" y2="1">
      <stop stop-color="#737aa2" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#414868" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b0c14" flood-opacity="0.55"/>
    </filter>
  </defs>
