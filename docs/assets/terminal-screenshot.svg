<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="598" viewBox="0 0 760 598" role="img" aria-labelledby="title desc">
  <title id="title">dotfiles — an install from command to completion</title>
  <desc id="desc">An animated, illustrative incremental install on Arch Linux with an already selected desktop profile. The command dotfiles install is typed, then the live Running row tracks concurrent tasks and the remaining count. Completed tasks show linked Git and Zsh configuration, installed neovim and zsh packages, and the default shell configured to zsh. After system packages finish, Paru and AUR checks precede their dependent tasks. Already current tasks stay quiet. The run ends with 3 changed, 14 current, and 18.6 seconds, matching the elapsed playback from the startup header to this summary, then returns to the two-line shell prompt with the home-directory marker above the cursor. Playback pauses on the result before repeating; typing and this pause are outside the reported run duration. Reduced motion shows the completed output.</desc>
