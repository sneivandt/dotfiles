<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="title desc">
  <title id="title">One dotfiles install on an Arch Linux desktop</title>
  <desc id="desc">Illustrative incremental install on an existing Arch desktop with its profile already selected, repository current, and package-manager authorization cached. The user types dotfiles install. Home symlinks restores Git and Zsh configuration, Shell completions writes updated zsh completions, and System packages installs fd and ripgrep. The live status is replaced in place as tasks complete; already-current tasks stay quiet. The run finishes with 3 changed and 14 current tasks in 10.0 seconds, followed immediately by the two-line shell prompt. A 20-second loop includes typing and a reading pause. Reduced motion shows the completed transcript.</desc>
  <style>
    /* Alacritty colors, Source Code Pro, a 10px cell and 24px terminal rows.
       One install: startup at 2.4s, summary at 12.4s, then hold to 20s.
       Step timing replaces terminal rows atomically, without crossfades. */
    @keyframes char-0 { 0% { opacity: 0; } 3.425%, 100% { opacity: 1; }  }
    .char-0 { animation: char-0 20s step-end infinite; }
    @keyframes char-1 { 0% { opacity: 0; } 3.85%, 100% { opacity: 1; }  }
    .char-1 { animation: char-1 20s step-end infinite; }
    @keyframes char-2 { 0% { opacity: 0; } 4.275%, 100% { opacity: 1; }  }
    .char-2 { animation: char-2 20s step-end infinite; }
    @keyframes char-3 { 0% { opacity: 0; } 4.7%, 100% { opacity: 1; }  }
    .char-3 { animation: char-3 20s step-end infinite; }
    @keyframes char-4 { 0% { opacity: 0; } 5.125%, 100% { opacity: 1; }  }
    .char-4 { animation: char-4 20s step-end infinite; }
    @keyframes char-5 { 0% { opacity: 0; } 5.55%, 100% { opacity: 1; }  }
    .char-5 { animation: char-5 20s step-end infinite; }
    @keyframes char-6 { 0% { opacity: 0; } 5.975%, 100% { opacity: 1; }  }
    .char-6 { animation: char-6 20s step-end infinite; }
    @keyframes char-7 { 0% { opacity: 0; } 6.4%, 100% { opacity: 1; }  }
    .char-7 { animation: char-7 20s step-end infinite; }
    @keyframes char-8 { 0% { opacity: 0; } 6.825%, 100% { opacity: 1; }  }
    .char-8 { animation: char-8 20s step-end infinite; }
    @keyframes char-9 { 0% { opacity: 0; } 7.25%, 100% { opacity: 1; }  }
    .char-9 { animation: char-9 20s step-end infinite; }
    @keyframes char-10 { 0% { opacity: 0; } 7.675%, 100% { opacity: 1; }  }
    .char-10 { animation: char-10 20s step-end infinite; }
    @keyframes char-11 { 0% { opacity: 0; } 8.1%, 100% { opacity: 1; }  }
    .char-11 { animation: char-11 20s step-end infinite; }
    @keyframes char-12 { 0% { opacity: 0; } 8.525%, 100% { opacity: 1; }  }
    .char-12 { animation: char-12 20s step-end infinite; }
    @keyframes char-13 { 0% { opacity: 0; } 8.95%, 100% { opacity: 1; }  }
    .char-13 { animation: char-13 20s step-end infinite; }
    @keyframes char-14 { 0% { opacity: 0; } 9.375%, 100% { opacity: 1; }  }
    .char-14 { animation: char-14 20s step-end infinite; }
    @keyframes char-15 { 0% { opacity: 0; } 9.8%, 100% { opacity: 1; }  }
    .char-15 { animation: char-15 20s step-end infinite; }
    @keyframes typing { 0% { opacity: 0; } 0.05% { opacity: 1; } 11%, 100% { opacity: 0; } }
    .typing { animation: typing 20s step-end infinite; }
    @keyframes caret { 0% { transform: translateX(0px); } 3.425% { transform: translateX(10px); } 3.85% { transform: translateX(20px); } 4.275% { transform: translateX(30px); } 4.7% { transform: translateX(40px); } 5.125% { transform: translateX(50px); } 5.55% { transform: translateX(60px); } 5.975% { transform: translateX(70px); } 6.4% { transform: translateX(80px); } 6.825% { transform: translateX(90px); } 7.25% { transform: translateX(100px); } 7.675% { transform: translateX(110px); } 8.1% { transform: translateX(120px); } 8.525% { transform: translateX(130px); } 8.95% { transform: translateX(140px); } 9.375% { transform: translateX(150px); } 9.8% { transform: translateX(160px); } }
    .caret { animation: caret 20s step-end infinite; }
    @keyframes startup { 0% { opacity: 0; } 12% { opacity: 1; }  }
    .startup { animation: startup 20s step-end infinite; }
    @keyframes links { 0% { opacity: 0; } 17% { opacity: 1; }  }
    .links { animation: links 20s step-end infinite; }
    @keyframes completions { 0% { opacity: 0; } 21% { opacity: 1; }  }
    .completions { animation: completions 20s step-end infinite; }
    @keyframes packages { 0% { opacity: 0; } 52.5% { opacity: 1; }  }
    .packages { animation: packages 20s step-end infinite; }
    @keyframes live-0 { 0% { opacity: 0; } 12% { opacity: 1; } 17%, 100% { opacity: 0; } }
    .live-0 { animation: live-0 20s step-end infinite; }
    @keyframes live-1 { 0% { opacity: 0; } 17% { opacity: 1; } 21%, 100% { opacity: 0; } }
    .live-1 { animation: live-1 20s step-end infinite; }
    @keyframes live-2 { 0% { opacity: 0; } 21% { opacity: 1; } 25.5%, 100% { opacity: 0; } }
    .live-2 { animation: live-2 20s step-end infinite; }
    @keyframes live-3 { 0% { opacity: 0; } 25.5% { opacity: 1; } 52.5%, 100% { opacity: 0; } }
    .live-3 { animation: live-3 20s step-end infinite; }
    @keyframes live-4 { 0% { opacity: 0; } 52.5% { opacity: 1; } 54.5%, 100% { opacity: 0; } }
    .live-4 { animation: live-4 20s step-end infinite; }
    @keyframes live-5 { 0% { opacity: 0; } 54.5% { opacity: 1; } 57%, 100% { opacity: 0; } }
    .live-5 { animation: live-5 20s step-end infinite; }
    @keyframes live-6 { 0% { opacity: 0; } 57% { opacity: 1; } 59.5%, 100% { opacity: 0; } }
    .live-6 { animation: live-6 20s step-end infinite; }
    @keyframes live-7 { 0% { opacity: 0; } 59.5% { opacity: 1; } 62%, 100% { opacity: 0; } }
    .live-7 { animation: live-7 20s step-end infinite; }
    @keyframes summary { 0% { opacity: 0; } 62% { opacity: 1; }  }
    .summary { animation: summary 20s step-end infinite; }
    @keyframes prompt { 0% { opacity: 0; } 62.5% { opacity: 1; }  }
    .prompt { animation: prompt 20s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .blink { animation: blink 1s step-end infinite; }
    /* Separate text elements avoid tspan opacity leaking across the text run. */
    [class^="char-"], .transient, [class^="live-"] { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      [class^="char-"] { opacity: 1; }
      .transient, [class^="live-"] { display: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="759" height="475" rx="8" fill="#1a1b26" stroke="#414868"/>
