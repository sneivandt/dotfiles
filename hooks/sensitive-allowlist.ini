# Sensitive Data Scanner Allowlist
#
# Added lines matching any pattern below are excluded from the sensitive-data
# scan in check-sensitive.sh. This exists so that structurally unavoidable
# false positives do not train contributors to reach for `--no-verify`, which
# would disable the entire scan rather than one known-safe case.
#
# Format:
#   - One Extended Regular Expression (ERE) per line
#   - Lines starting with # are comments (ignored)
#   - Empty lines and [section] headers are ignored
#   - Patterns are matched case-insensitively against the whole added line
#
# Rules for adding an entry:
#   - Match the specific safe construct, never a whole file or directory
#   - Prefer anchoring on surrounding syntax (`uses:`, a known test domain)
#   - Only the matched span is redacted, so the rest of the line is still
#     scanned; keep entries as narrow as the construct they describe

# Pinned GitHub Actions
# Supply-chain policy requires `uses:` to reference a full 40-character commit
# SHA. Roughly one SHA in three contains ten consecutive digits, which matches
# the US phone-number and SSN patterns by coincidence.
[actions-sha-pins]
uses:[[:space:]]*[A-Za-z0-9._/-]+@[0-9a-f]{40}

# Test fixture address
# This repository's established fixture address for CI jobs that must set
# user.email before creating a commit lives at the reserved `.local` suffix
# (see .github/workflows/scripts/*/[Tt]est-[Aa]pplications.*). RFC 6762
# reserves `.local` for mDNS, so it cannot be a routable mailbox.
#
# Deliberately narrow: reserved documentation domains such as example.com are
# NOT allowlisted, because the scanner's own PII coverage is asserted with an
# example.com address.
#
# The leading context class is required. Without it, this would also match the
# credential half of a database connection URL ending in the same suffix and
# suppress the database-URL detection. Note the class excludes ':' for exactly
# that reason.
[test-emails]
(^|[[:space:]'"=<([`])[a-zA-Z0-9._%+-]+@test\.local

# Release version tags
# Release tags are vYYYY.MM.DD.N, which the IPv4 pattern matches as four
# dot-separated numeric groups.
[release-tags]
v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+
