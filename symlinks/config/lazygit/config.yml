# Source Code Pro is not a Nerd Font. Use the existing terminal palette.
gui:
  nerdFontsVersion: ""
  showRandomTip: false
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    searchingActiveBorderColor:
      - "#e0af68"
      - bold
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    unstagedChangesColor:
      - "#f7768e"

# Use the diff view's width, rather than the full terminal width.
git:
  diffRenderers:
    - name: delta
      command: 'delta --paging=never --width={{.width}} {{if ge .width 160}}--side-by-side{{end}} --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
    - name: raw
      type: rawGit
